services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tfwp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfwp}
      POSTGRES_DB: ${POSTGRES_DB:-tfwp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tfwp} -d ${POSTGRES_DB:-tfwp}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tfwp}:${POSTGRES_PASSWORD:-tfwp}@db:5432/${POSTGRES_DB:-tfwp}
      RAW_DATA_DIR: /srv/data/raw
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Read-only: the loader reads the quarterly files, it never writes them.
      - ./data:/srv/data:ro
      # Source is mounted so edits and generated migrations are live on both
      # sides without a rebuild. The image still COPYs all of this, so it runs
      # standalone; the mounts are a development convenience, not a dependency.
      - ./app:/srv/app
      - ./ingest:/srv/ingest
      - ./alembic:/srv/alembic
      - ./scripts:/srv/scripts
      - ./tests:/srv/tests

volumes:
  pgdata:
